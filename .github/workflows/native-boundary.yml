name: Native Runtime Boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-boundary:
    name: Check native Android boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native runtime boundary
        run: python3 tools/check_native_boundary.py

  native-pr-validation:
    name: Compile release Kotlin and run native tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: native-boundary
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile release Kotlin and run native tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin test --stacktrace --console=plain
