name: Native Android CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contracts:
    name: Native boundary and documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify native runtime boundary
        run: python tools/check_native_boundary.py
      - name: Verify release notes and documentation links
        run: |
          node tools/update-release-notes.mjs --check
          node tools/check-doc-links.mjs

  release-compile-and-tests:
    name: Release Kotlin compile and unit tests
    runs-on: ubuntu-latest
    needs: repository-contracts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36 and Build Tools 35
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile release Kotlin and run native tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileReleaseKotlin test --stacktrace --console=plain 2>&1 | tee gradle-test.log
      - name: Surface Gradle failure details in annotations
        if: failure()
        shell: bash
        run: |
          {
            grep -E '(^FAILURE:|^e: |error:|Execution failed for task|What went wrong:|^> Task .* FAILED|Could not resolve|No matching variant|Unresolved reference)' gradle-test.log || true
            tail -n 25 gradle-test.log
          } | tail -n 45 | while IFS= read -r line; do
            line="${line:0:1000}"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            printf '::error title=Gradle failure detail::%s\n' "$line"
          done
      - name: Upload test and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-ci-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            gradle-test.log
          if-no-files-found: ignore
          retention-days: 14
